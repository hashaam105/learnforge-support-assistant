name: CI

# The point of this workflow is to prove the claim in the README: the
# prototype runs with no API keys at all. No secrets are configured, so if
# anything here starts needing a key, the build breaks rather than the claim
# quietly becoming false.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest the knowledge base
        run: python -m app.ingest

      - name: Unit tests
        run: python -m pytest -q

      - name: Retrieval evaluation (deterministic, keyless)
        run: python -m eval.run --retrieval-only --report eval_reports/ci.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: eval_reports/ci.json
          if-no-files-found: ignore
